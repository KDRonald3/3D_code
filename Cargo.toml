[package]
name = "horizon"
version = "0.1.0"
edition = "2021"
description = "Build a navigable function map of a Rust repository."
license = "MIT"
exclude = ["tests/fixtures"]

[workspace]
resolver = "2"
members = ["."]
exclude = ["tests/fixtures"]

[lib]
name = "horizon"
path = "src/lib.rs"

[[bin]]
name = "horizon"
path = "src/bin/horizon.rs"

[[bin]]
name = "measure_correctness"
path = "src/bin/measure_correctness.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
ra_ap_syntax = "0.0.343"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[profile.release]
opt-level = 2
